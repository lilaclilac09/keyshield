[workspace]
resolver = "2"
# Root workspace owns ONLY the on-chain Solana program. The Rust hot-path
# proxy at src/proxy/ has its OWN [workspace] with 6 crates and its own
# dep tree (axum, reqwest, rustls, ...), so we exclude it here to avoid
# the "multiple workspace roots" error from cargo metadata / cargo
# build-sbf. To run proxy tests: `cargo test --manifest-path src/proxy/Cargo.toml`.
members = ["src/programs/keyshield"]
# Host/WASM HVC engine has its own lockfile so `secrecy`/`zeroize`
# do not unify with solana-sdk's `curve25519-dalek` (zeroize <1.4).
# Run: cargo test --manifest-path src/session-engine/Cargo.toml
exclude = ["src/proxy", "src/session-engine"]

[workspace.dependencies]
pinocchio = "0.9"
pinocchio-token = "0.4"
pinocchio-system = "0.3"
