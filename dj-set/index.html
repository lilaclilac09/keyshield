<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Set — Carousel</title>
  <style>
    :root {
      --bg: #090b12;
      --card: #121722;
      --text: #f5f7ff;
      --muted: #9aa6c7;
      --accent: #7c8cff;
      --border: rgba(255,255,255,0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #1a2140, var(--bg) 55%);
      color: var(--text);
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 28px 16px 48px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .sub { color: var(--muted); margin-bottom: 20px; }

    .carousel {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      overflow: hidden;
    }

    .track-stage {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 18px;
      align-items: center;
      min-height: 260px;
    }

    .cover {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #0d111b;
    }

    .meta h2 { margin: 0 0 6px; font-size: 24px; }
    .meta p { margin: 0 0 8px; color: var(--muted); }
    .pill {
      display: inline-block;
      margin: 0 8px 8px 0;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    .links a {
      color: #b9c4ff;
      margin-right: 12px;
      font-size: 14px;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }

    .btn {
      background: #1b2440;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .dots { display: flex; gap: 8px; }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #3a4568; border: 0; cursor: pointer;
    }
    .dot.active { background: var(--accent); }

    .thumbs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .thumb {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      background: #0f1422;
      padding: 0;
    }
    .thumb img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .thumb.active { outline: 2px solid var(--accent); }

    iframe {
      width: 100%;
      border: 0;
      border-radius: 12px;
      margin-top: 12px;
      min-height: 152px;
    }

    @media (max-width: 760px) {
      .track-stage { grid-template-columns: 1fr; }
      .cover { max-width: 240px; margin: 0 auto; display: block; }
      .thumbs { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>DJ Set</h1>
    <p class="sub">Carousel · 曲目封面 + 元数据 + Spotify（如有）</p>

    <section class="carousel" aria-label="DJ set carousel">
      <div class="track-stage">
        <img id="cover" class="cover" src="assets/covers/daydreaming.jpg" alt="Track cover" />
        <div class="meta">
          <h2 id="title">—</h2>
          <p id="artist">—</p>
          <div>
            <span class="pill" id="album">—</span>
            <span class="pill" id="duration">—</span>
            <span class="pill" id="position">—</span>
          </div>
          <div class="links" id="links"></div>
          <div id="player"></div>
        </div>
      </div>

      <div class="controls">
        <button class="btn" id="prev" type="button">← Prev</button>
        <div class="dots" id="dots"></div>
        <button class="btn" id="next" type="button">Next →</button>
      </div>

      <div class="thumbs" id="thumbs"></div>
    </section>
  </div>

  <script>
    let tracks = [];
    let index = 0;

    function renderTrack(i) {
      const t = tracks[i];
      if (!t) return;
      index = i;

      document.getElementById('cover').src = t.cover;
      document.getElementById('cover').alt = `${t.title} cover`;
      document.getElementById('title').textContent = t.title;
      document.getElementById('artist').textContent = t.artist;
      document.getElementById('album').textContent = `${t.album}${t.year ? ` (${t.year})` : ''}`;
      document.getElementById('duration').textContent = t.duration || '—';
      document.getElementById('position').textContent = `#${t.position}`;

      const links = document.getElementById('links');
      links.innerHTML = '';
      if (t.spotify?.url) {
        const a = document.createElement('a');
        a.href = t.spotify.url;
        a.target = '_blank';
        a.rel = 'noreferrer';
        a.textContent = 'Open on Spotify';
        links.appendChild(a);
      }
      if (t.links?.release) {
        const a = document.createElement('a');
        a.href = t.links.release;
        a.target = '_blank';
        a.rel = 'noreferrer';
        a.textContent = 'Release page';
        links.appendChild(a);
      }
      if (t.links?.album) {
        const a = document.createElement('a');
        a.href = t.links.album;
        a.target = '_blank';
        a.rel = 'noreferrer';
        a.textContent = 'Album page';
        links.appendChild(a);
      }

      const player = document.getElementById('player');
      player.innerHTML = '';
      if (t.spotify?.embed) {
        const iframe = document.createElement('iframe');
        iframe.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
        iframe.loading = 'lazy';
        iframe.src = t.spotify.embed;
        player.appendChild(iframe);
      }

      document.querySelectorAll('.dot').forEach((d, n) => d.classList.toggle('active', n === i));
      document.querySelectorAll('.thumb').forEach((el, n) => el.classList.toggle('active', n === i));
    }

    function buildUI() {
      const dots = document.getElementById('dots');
      const thumbs = document.getElementById('thumbs');
      dots.innerHTML = '';
      thumbs.innerHTML = '';

      tracks.forEach((t, i) => {
        const dot = document.createElement('button');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        dot.type = 'button';
        dot.setAttribute('aria-label', `Go to track ${i + 1}`);
        dot.addEventListener('click', () => renderTrack(i));
        dots.appendChild(dot);

        const thumb = document.createElement('button');
        thumb.className = 'thumb' + (i === 0 ? ' active' : '');
        thumb.type = 'button';
        thumb.innerHTML = `<img src="${t.cover}" alt="${t.title}" />`;
        thumb.addEventListener('click', () => renderTrack(i));
        thumbs.appendChild(thumb);
      });

      document.getElementById('prev').onclick = () => renderTrack((index - 1 + tracks.length) % tracks.length);
      document.getElementById('next').onclick = () => renderTrack((index + 1) % tracks.length);
      renderTrack(0);
    }

    fetch('setlist.json')
      .then((r) => r.json())
      .then((data) => {
        tracks = data.tracks;
        buildUI();
      })
      .catch((err) => {
        console.error(err);
        document.querySelector('.sub').textContent = 'Failed to load setlist.json';
      });
  </script>
</body>
</html>
