# Runs the TypeScript test suite across:
#   - npm workspaces (packages/agent-sdk, packages/cli, packages/goat-wallet,
#     infra/sync-worker, mobile)
#   - frontend/ (NOT a workspace — separate Vite app + Chrome extension build)
#
# Complements `test.yml` (Rust/Solana program + proxy-rs) and
# `sync-worker-deploy.yml` (Cloudflare Worker deploy).

name: node-tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  workspaces:
    name: Workspaces typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck (workspaces)
        run: npm run typecheck --workspaces --if-present

      - name: Test (workspaces)
        run: npm test

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install (frontend/)
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build (Vite + Chrome extension)
        working-directory: frontend
        run: npm run build
