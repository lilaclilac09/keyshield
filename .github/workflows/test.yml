# KeyShield: unit tests (Mollusk) and optional integration (Surfpool)
# Run: cargo build-sbf && cargo test -p keyshield

name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit tests (Mollusk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Build program
        run: cargo build-sbf

      - name: Run unit tests
        run: cargo test -p keyshield

  integration-tests:
    name: Integration (Surfpool)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Build program
        run: cargo build-sbf

      - name: Install Surfpool
        run: cargo install surfpool --locked 2>/dev/null || cargo install surfpool

      - name: Start Surfnet
        run: |
          surfpool start --background || true
          sleep 10

      - name: Run integration script
        run: |
          solana config set --url http://localhost:8899
          ./scripts/integration-surfpool.sh || true
        continue-on-error: true
