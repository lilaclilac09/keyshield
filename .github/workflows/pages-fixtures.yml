name: Deploy fixtures to GitHub Pages

# Publishes extension-sync/test/fixtures/ to GitHub Pages so reviewers
# (hackathon judges, anyone testing the extension) can hit a live URL
# instead of having to clone + open file:// pages locally.
#
# After the first run, the fixture hub will live at:
#   https://<owner>.github.io/<repo>/
#
# Enable Pages once via the GitHub UI:
#   Settings → Pages → Source: "GitHub Actions"
# Then push to main or hit "Run workflow" to publish.

on:
  push:
    branches: [main]
    paths:
      - 'extension-sync/test/fixtures/**'
      - 'extension-sync/src/**'
      - 'extension-sync/manifest.ts'
      - 'extension-sync/scripts/build-extension.mjs'
      - 'extension-sync/vite.config.ts'
      - 'extension-sync/package.json'
      - '.github/workflows/pages-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension-sync/package-lock.json

      - name: Install extension-sync deps
        working-directory: extension-sync
        run: npm ci || npm install

      - name: Build extension (dist/)
        working-directory: extension-sync
        run: npm run build:ext

      - name: Stage fixtures + downloadable extension zip for Pages
        run: |
          mkdir -p _site
          cp -r extension-sync/test/fixtures/. _site/
          # Bundle dist/ as a downloadable zip so reviewers can grab a
          # ready-to-Load-unpacked extension from the fixture index page.
          (cd extension-sync/dist && zip -r ../../_site/keyshield-extension.zip . -q)
          ls -la _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
