# CI/CD for KeyShield v2-MVP (Python)
name: KeyShield v2 CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "v2-mvp/**"
      - ".github/workflows/v2-python.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "v2-mvp/**"
      - ".github/workflows/v2-python.yml"
  workflow_dispatch:  # manual trigger

env:
  SERVER_SECRET: CHANGE-ME-IN-PROD-32-BYTES-MIN
  KS_INTERNAL_SECRET: test-secret-key
  KS_X402_BASE_RPC_URL: https://mainnet.base.org
  KS_X402_RECEIVER_ADDRESS: 0x1234567890abcdef1234567890abcdef12345678

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd v2-mvp
          pip install --upgrade pip
          pip install ruff mypy pytest httpx cryptography pynacl base58

      - name: Run ruff linter
        run: cd v2-mvp && ruff check src/ tests/ trading/

      - name: Run ruff format
        run: cd v2-mvp && ruff format --check src/ tests/ trading/

      - name: Run mypy type checking
        run: cd v2-mvp && mypy src/ --ignore-missing-imports

  test:
    name: Run Tests
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd v2-mvp
          pip install --upgrade pip
          pip install pytest pytest-asyncio httpx cryptography pynacl base58 fastapi

      - name: Run unit tests with coverage
        run: |
          cd v2-mvp
          pytest tests/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            2>&1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./v2-mvp/coverage.xml
          fail_ci_if_error: false

  uat:
    name: User Acceptance Tests
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd v2-mvp
          pip install --upgrade pip
          pip install pytest httpx cryptography pynacl base58 fastapi

      - name: Run UAT suite
        run: |
          cd v2-mvp
          python -m tests.uat --quiet

  build-and-test:
    name: Build & Test (Full)
    needs: [test, uat]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd v2-mvp
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pytest httpx cryptography pynacl base58 fastapi

      - name: Verify server starts
        run: |
          cd v2-mvp
          timeout 10 python -c "from src.server import app; print('✓ Server app loaded')" || true

      - name: Verify SDK loads
        run: |
          cd v2-mvp
          python keyshield_sdk.py health || echo "SDK module OK"

      - name: Verify CLI loads
        run: |
          cd v2-mvp
          bash keyshield-cli.sh 2>&1 | head -5 || true

      - name: Verify trading module loads
        run: |
          cd v2-mvp
          python -c "from trading.agent import TradingOrchestrator; print('✓ Trading agent OK')"

      - name: Final status
        run: |
          echo "✓ Build & Test passed for $(git rev-parse --short HEAD)"
