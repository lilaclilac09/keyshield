# Build & push the three KeyShield images (python / rust-proxy / web-v2)
# to GitHub Container Registry on every push to main and on tag pushes.
#
# Why all-three-in-one workflow: they share the same triggers and the
# same auth, and emitting them as one matrix lets us add an inter-image
# `depends_on:`-equivalent later (e.g. python must be tested healthy
# before rust-proxy proceeds).
#
# Cache: per-image GHA cache — buildx mode=max so we don't re-rebuild
# the rust deps every commit.

name: docker-build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Only fire when something Docker-relevant changed. The tag-push
    # branch above is unconditional (release builds always go).
    paths:
      - 'Dockerfile.*'
      - 'docker-compose.yml'
      - 'src/backend/**'
      - 'src/proxy/**'
      - 'src/web/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write   # needed to push to ghcr.io/<owner>/<repo>

concurrency:
  # One build per ref. A new push to main cancels the prior pending one.
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: python
            file: Dockerfile.python
            context: .
          - name: rust-proxy
            file: Dockerfile.proxy
            context: ./src/proxy
          - name: web-v2
            file: Dockerfile.web
            context: ./src/web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          IMG: ghcr.io/${{ github.repository_owner }}/keyshield-${{ matrix.image.name }}
        run: |
          set -eu
          # Lowercase the owner because GHCR rejects mixed case.
          IMG_LC=$(echo "$IMG" | tr '[:upper:]' '[:lower:]')
          tags="$IMG_LC:sha-${GITHUB_SHA::12}"
          # Branch / tag aliases.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tags="$tags,$IMG_LC:${GITHUB_REF_NAME}"
            tags="$tags,$IMG_LC:latest"
          elif [ "${GITHUB_REF_NAME:-}" = "main" ]; then
            tags="$tags,$IMG_LC:main"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          # Restrict to amd64 by default — the Rust build alone can take
          # 8+ minutes per arch on GHA runners. Add arm64 here if/when
          # production needs it.
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
          # Surface the build summary on the GitHub Actions run page so
          # operators can see image size + layer cache hits without
          # digging through logs.
          provenance: false
