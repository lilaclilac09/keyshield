[package]
name = "ks-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ks-proxy"
path = "src/main.rs"

[lib]
name = "ks_proxy"
path = "src/lib.rs"

[dependencies]
axum = { workspace = true }
axum-server = { version = "0.7", features = ["tls-rustls"] }
bytes = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
ks-cache = { path = "../ks-cache" }
ks-session = { path = "../ks-session" }
ks-upstream = { path = "../ks-upstream" }
ks-vault = { path = "../ks-vault" }
instant-acme = { version = "0.8", features = ["rcgen"] }
rcgen = "0.13"
reqwest = { workspace = true }
# rustls 0.23 made CryptoProvider selection explicit. We pin `ring`
# (no cmake / aws-lc-sys build deps) and disable default features so
# we can opt into exactly one provider — see ADR-007 §"Provider".
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
base64 = "0.22"
http-body-util = "0.1"
# Used by tests/acme_pebble.rs only — pebble's mgmt endpoint serves a
# self-signed cert, so we need a client that accepts it. Workspace
# `reqwest` already enables `rustls-tls`; the dev profile picks up the
# same crate but adds no production dep weight.
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
wiremock = { workspace = true }
