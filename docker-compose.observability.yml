version: "3.9"

# KeyShield observability stack — Prometheus + Grafana
#
# Usage:
#   docker compose -f docker-compose.observability.yml up -d
#
# Then open:
#   Grafana    → http://localhost:3001  (admin / admin)
#   Prometheus → http://localhost:9090
#
# Your KeyShield services must be running on the host (bash scripts/dev.sh).
# host.docker.internal resolves to the host machine from inside Docker.

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: ks-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"          # POST /-/reload to hot-reload config
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux compat (Mac works natively)

  grafana:
    image: grafana/grafana:10.4.2
    container_name: ks-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"                        # 3000 is taken by the frontend dev server
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/keyshield.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
