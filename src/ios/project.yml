name: KeyShield
configs:
  Debug: debug
  Release: release
  SimulatorRelease: release
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: '1,2'
  configs:
    SimulatorRelease:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator*]: '$(inherited) SIMULATOR_APPROVAL_DEMO'
targets:
  KeyShield:
    type: application
    platform: iOS
    sources: [KeyShield]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.aileena.keyshield.ios
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: '-'
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: KeyShield/Simulator.entitlements
        INFOPLIST_KEY_NSFaceIDUsageDescription: Approve a displayed KeyShield operation.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  KeyShieldTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KeyShieldTests]
    dependencies:
      - target: KeyShield
  KeyShieldUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [KeyShieldUITests]
    dependencies:
      - target: KeyShield
schemes:
  KeyShield:
    build:
      targets:
        KeyShield: all
    test:
      targets: [KeyShieldTests, KeyShieldUITests]
  KeyShieldSimulatorTester:
    build:
      targets:
        KeyShield: all
    run:
      config: SimulatorRelease
    test:
      config: SimulatorRelease
      targets: [KeyShieldUITests]
