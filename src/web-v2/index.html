<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Zero-Trust API Key Vault — encrypted secrets, injected per-request" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/@solana/wallet-adapter-react-ui/styles.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: 'Montserrat', 'Inter', sans-serif;
        background-color: #000000;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .font-mono { font-family: 'JetBrains Mono', monospace; }

      /* Wallet Adapter Modal — Institutional Theme */
      .wallet-adapter-modal-wrapper {
        background: #0a0a0a !important;
        border: 1px solid #262626 !important;
        color: #ffffff !important;
        border-radius: 3px !important;
      }
      .wallet-adapter-modal-title {
        font-family: 'Montserrat', sans-serif !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.05em !important;
        color: #ffffff !important;
      }
      .wallet-adapter-button {
        background-color: #ffffff !important;
        border: 1px solid #ffffff !important;
        color: #000000 !important;
        font-family: 'Montserrat', sans-serif !important;
        font-weight: 600 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.05em !important;
        border-radius: 2px !important;
        transition: all 0.15s !important;
      }
      .wallet-adapter-button:not([disabled]):hover { background-color: #e5e5e5 !important; }
      .wallet-adapter-button-start-icon { display: none !important; }
      .wallet-adapter-modal-list-more { color: #ffffff !important; font-family: 'Montserrat', sans-serif !important; }
      .wallet-adapter-modal-list-more-icon { display: none !important; }
      .wallet-adapter-modal-close { color: #ffffff !important; }

      /* Page transition */
      .page-enter { opacity: 0; transform: translateY(4px); }
      .page-enter-active { opacity: 1; transform: translateY(0); transition: all 200ms ease-out; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
