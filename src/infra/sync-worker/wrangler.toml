name = "keyshield-sync"
main = "src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# Production custom domain. Add `sync.ks.aileena.xyz` to your Cloudflare
# DNS as a proxied record (orange cloud), then wrangler will route to here.
# Custom Domains require the zone (aileena.xyz) on the same CF account.
routes = [
  { pattern = "sync.ks.aileena.xyz", custom_domain = true },
]

# Encrypted-at-rest vault ciphertext, addressed by the PRF-derived
# vault ID. Bind a real R2 bucket before `wrangler deploy`.
[[r2_buckets]]
binding = "VAULTS"
bucket_name = "keyshield-vaults"
preview_bucket_name = "keyshield-vaults-preview"

# Same bucket pattern for the publickey registry used by Step 2 auth.
[[r2_buckets]]
binding = "REGISTRY"
bucket_name = "keyshield-registry"
preview_bucket_name = "keyshield-registry-preview"

# Per-IP limit for the public /auth/* POSTs (src/ratelimit.ts).
# 20 requests per 60 s per route per IP. `period` must be 10 or 60.
# namespace_id is any account-unique integer string you pick.
[[unsafe.bindings]]
name = "AUTH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[vars]
# JWT_SECRET is NOT a var. Set it once as a secret (never commit it):
#   openssl rand -hex 32 | npx wrangler secret put JWT_SECRET
# For `wrangler dev`, put a long random JWT_SECRET in .dev.vars (gitignored).
# The worker answers 503 on every non-health route until it is set.
JWT_ISSUER = "keyshield-sync"
# Max bytes a single vault ciphertext can be. 64 KB covers ~200 keys
# even before compression.
MAX_VAULT_BYTES = "65536"
