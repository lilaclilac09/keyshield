name = "keyshield-sync"
main = "src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# Encrypted-at-rest vault ciphertext, addressed by the PRF-derived
# vault ID. Bind a real R2 bucket before `wrangler deploy`.
[[r2_buckets]]
binding = "VAULTS"
bucket_name = "keyshield-vaults"
preview_bucket_name = "keyshield-vaults-preview"

# Same bucket pattern for the publickey registry used by Step 2 auth.
[[r2_buckets]]
binding = "REGISTRY"
bucket_name = "keyshield-registry"
preview_bucket_name = "keyshield-registry-preview"

[vars]
# Override these with `wrangler secret put` in production.
# JWT_SECRET is generated by sync-auth — keep it long and random.
JWT_SECRET = "dev-only-replace-with-wrangler-secret-in-production"
JWT_ISSUER = "keyshield-sync"
# Max bytes a single vault ciphertext can be. 64 KB covers ~200 keys
# even before compression.
MAX_VAULT_BYTES = "65536"
