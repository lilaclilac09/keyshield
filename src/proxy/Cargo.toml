[workspace]
resolver = "2"
# proxy-helius/ at repo root is a stale snapshot of ks-helius — not a member.
# Canonical crate: crates/ks-helius
members = [
    "crates/ks-vault",
    "crates/ks-session",
    "crates/ks-cache",
    "crates/ks-upstream",
    "crates/ks-proxy",
    "crates/ks-helius",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
axum = "0.7"
bytes = "1"
dashmap = "6"
futures = "0.3"
http = "1"
moka = { version = "0.12", features = ["future"] }
pbkdf2 = "0.12"
redb = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
wiremock = "0.6"
