[package]
name = "keyshield"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "KeyShield - Private API Vault on Solana with ZK proofs, MPC, and Lit Protocol"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
std = []

# Host `cargo test` / rustc do not know `target_os = "solana"`. Tell check-cfg
# so pinocchio macros and zk_verify do not emit unexpected_cfgs noise.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
pinocchio = { workspace = true }
pinocchio-token = { workspace = true }
pinocchio-system = { workspace = true }

[dev-dependencies]
mollusk-svm = "0.0.12"
solana-sdk = "2.1"
proptest = "1"

[[test]]
name = "fuzz_invariants"
path = "../../../tests/fuzz_invariants.rs"
