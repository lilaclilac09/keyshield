server {
    listen 3000;
    listen [::]:3000;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Long cache for hashed Vite build artifacts (filenames carry hashes,
    # so the immutable hint is safe).
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico|webp|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every unknown route returns the index, so React
    # Router deep links work after a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Trivial health endpoint distinct from the SPA so HEALTHCHECK
    # doesn't reload index.html every 30s.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
}
