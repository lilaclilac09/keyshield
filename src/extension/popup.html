<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeyShield</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0a0d1a;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }
    h1 {
      margin: 0 0 4px 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .sub {
      color: #71717a;
      font-size: 11px;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 4px;
      margin-top: 10px;
    }
    input[type="text"] {
      box-sizing: border-box;
      width: 100%;
      padding: 7px 9px;
      background: #020408;
      border: 1px solid #1c2238;
      border-radius: 6px;
      color: #e4e4e7;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #5b8cff;
    }
    button {
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
      padding: 8px 12px;
      background: #5b8cff;
      color: white;
      border: 1px solid #5b8cff;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }
    button:hover {
      background: #7aa1ff;
    }
    .status {
      margin-top: 10px;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
    }
    .status.ok {
      display: block;
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status.err {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(91, 140, 255, 0.15);
      color: #93b4ff;
      border: 1px solid rgba(91, 140, 255, 0.3);
      margin-left: 4px;
    }
    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #1c2238;
      font-size: 10px;
      color: #71717a;
    }
  </style>
</head>
<body>
  <h1>KeyShield Vault <span class="badge" id="conn">…</span></h1>
  <div class="sub">Auto-detect API keys and store them in your encrypted vault.</div>

  <label for="api">Backend API base URL</label>
  <input type="text" id="api" placeholder="http://127.0.0.1:8001" />

  <label for="dash">Dashboard URL (fallback)</label>
  <input type="text" id="dash" placeholder="http://127.0.0.1:8001" />

  <button id="save">Save settings</button>
  <div id="status" class="status"></div>

  <div class="footer">
    Token is registered automatically when you sign into the dashboard.
  </div>

  <script src="popup.js"></script>
</body>
</html>
