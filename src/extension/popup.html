<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeyShield</title>
  <style>
    :root { color-scheme: dark; }
    body {
      width: 280px;
      margin: 0;
      padding: 14px 16px 16px;
      background: #0a0d1a;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.45;
      word-spacing: 0.06em;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      word-spacing: 0.08em;
    }
    .status {
      margin: 0 0 10px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      word-spacing: 0.08em;
      display: none;
    }
    .status.ok {
      display: block;
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status.err {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    button {
      cursor: pointer;
      display: block;
      width: 100%;
      margin: 0 0 10px;
      padding: 10px 12px;
      background: #5b8cff;
      color: #fff;
      border: 1px solid #5b8cff;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      word-spacing: 0.08em;
      letter-spacing: 0.01em;
    }
    button:last-child { margin-bottom: 0; }
    button.secondary {
      background: transparent;
      color: #e4e4e7;
      border-color: #27272a;
    }
    button.danger {
      background: transparent;
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }
    .saved-count {
      margin: 0 0 10px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      word-spacing: 0.06em;
      color: #fafafa;
      line-height: 1.1;
    }
    .api-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      margin: 0 0 8px;
      background: #020408;
      border: 1px solid #1c2238;
      border-radius: 8px;
      word-spacing: 0.06em;
    }
    .api-row strong { font-size: 12px; color: #e4e4e7; }
    .api-row code { font-size: 11px; color: #93b4ff; word-break: break-all; }
    .sub { margin: 0 0 10px; color: #71717a; font-size: 12px; word-spacing: 0.06em; }
    body.signed-in .guest-only { display: none !important; }
    body:not(.signed-in) .signed-only { display: none !important; }
    body.signed-in #detect-ready { display: none !important; }
    .extra { display: none !important; }
  </style>
</head>
<body data-ui="three-line">
  <h1>KeyShield — Sovereign Vault</h1>
  <div id="detect-ready" class="status" style="display:block">checking 1.2.4 + &lt;all_urls&gt;…</div>

  <div id="signed-pane" class="signed-only">
    <p id="saved-count" class="saved-count">0 saved</p>
    <div id="saved-apis"></div>
    <p id="saved-empty" class="sub">None yet. Detect stays on.</p>
    <button id="clear-top" class="danger">Sign out</button>
  </div>

  <button id="signin" class="guest-only">Sign in to KeyShield</button>
  <button id="allow-detect" class="secondary guest-only">Allow detect + auto-save</button>

  <div id="status" class="status"></div>

  <div class="extra" hidden>
    <span id="conn"></span>
    <div id="build"></div>
    <button id="fill-tab-signed"></button>
    <button id="copy-cursor-key-signed"></button>
    <button id="fill-tab"></button>
    <button id="copy-cursor-key"></button>
    <button id="use-hosted-top"></button>
    <textarea id="manual"></textarea>
    <button id="register"></button>
    <button id="clear"></button>
    <input id="api" type="text" />
    <input id="dash" type="text" />
    <button id="save"></button>
    <div id="fingerprint"></div>
    <input id="remote" type="text" />
    <button id="point-remote"></button>
    <button id="point-local"></button>
    <button id="point-prod"></button>
    <button id="export-vault"></button>
    <input id="import-file" type="file" />
    <button id="import-vault"></button>
    <div id="backup-status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
