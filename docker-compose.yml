# KeyShield full-stack Docker Compose
#
# Services:
#   python       — API control plane (FastAPI)
#   rust-proxy   — Hot-path proxy (compiled binary)
#   postgres     — Session + key storage
#   redis        — Cache layer
#   frontend     — React dashboard
#
# Usage:
#   docker compose up -d           # start all
#   docker compose down            # stop all
#   docker compose logs -f python  # tail API logs

version: "3.9"

services:
  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: keyshield-python
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SERVER_SECRET=${SERVER_SECRET:-CHANGE-ME}
      - KS_INTERNAL_SECRET=${KS_INTERNAL_SECRET:-test-secret}
      - DATABASE_URL=postgresql://keyshield:keyshield@postgres:5432/keyshield
      - REDIS_URL=redis://redis:6379/0
      - KS_X402_BASE_RPC_URL=${KS_X402_BASE_RPC_URL:-https://mainnet.base.org}
      - HELIUS_API_KEY=${HELIUS_API_KEY:-}
    networks:
      - public
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request,sys; r=urllib.request.urlopen(\"http://localhost:8000/health\",timeout=3); sys.exit(0 if r.status==200 else 1)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    cpus: 0.75

  rust-proxy:
    build:
      context: ./src/proxy
      dockerfile: ../Dockerfile.proxy
    container_name: keyshield-rust
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PROXY_PORT=3000
      - PYTHON_PROXY_URL=http://python:8000
      - HELIUS_API_KEY=${HELIUS_API_KEY:-}
    networks:
      - public
      - backend
    depends_on:
      python:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 384m
    cpus: 0.5

  postgres:
    image: postgres:16-alpine
    container_name: keyshield-db
    restart: unless-stopped
    # Postgres + Redis intentionally NOT on the public network.
    # They're only reachable from python via the `backend` network.
    networks:
      - backend
    environment:
      POSTGRES_USER: keyshield
      POSTGRES_PASSWORD: keyshield
      POSTGRES_DB: keyshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyshield"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    cpus: 0.5

  redis:
    image: redis:7-alpine
    container_name: keyshield-redis
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: 0.25

  frontend:
    # 2026-05-10: previous src/web was archived to src/_archive/web-v2/
    # and the dashboard renamed to src/web/. Build context follows.
    build:
      context: ./src/web
      dockerfile: ../../Dockerfile.web
      args:
        # Build-time env baked into the JS bundle. Override via .env
        # or `docker compose build --build-arg KEYSHIELD_API_URL=...`.
        KEYSHIELD_API_URL: ${KEYSHIELD_API_URL:-http://localhost:8000}
        KEYSHIELD_PROGRAM_ID: ${KEYSHIELD_PROGRAM_ID:-41P2wHKAr69aSgLgt1QdKH6VVgK6uFYKM7hpKAyBxr9j}
        KEYSHIELD_SOLANA_CLUSTER: ${KEYSHIELD_SOLANA_CLUSTER:-devnet}
        KEYSHIELD_SYNC_URL: ${KEYSHIELD_SYNC_URL:-http://localhost:8787}
    container_name: keyshield-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - public
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 192m
    cpus: 0.25

# ─── Networks ───────────────────────────────────────────────────────
# `public`  : services that need to be reachable from the host (or, in
#             prod, from a reverse proxy / load balancer).
# `backend` : DB + cache. Only reachable from python — postgres + redis
#             have NO host port mapping, so even with the daemon socket
#             open they can't be hit from outside this network.
networks:
  public:
    driver: bridge
  backend:
    driver: bridge
    internal: true   # blocks outbound to the internet from this network

volumes:
  postgres_data:
  redis_data:
