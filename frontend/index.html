
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyShield Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Solana Wallet Adapter Styles -->
    <link rel="stylesheet" href="https://unpkg.com/@solana/wallet-adapter-react-ui/styles.css">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #131314;
        color: #e3e3e3;
        overflow-x: hidden;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .cyber-glow {
        box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
      }
      .cyber-glow-red {
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      .scanline {
        pointer-events: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, transparent, rgba(139, 92, 246, 0.05), transparent);
        animation: scanline 8s linear infinite;
      }
      /* Override Wallet Modal Colors for Cyberpunk Theme */
      .wallet-adapter-modal-wrapper {
        background: #1e1f20 !important;
        border: 1px solid #2e2e30 !important;
        color: #fafafa !important;
      }
      .wallet-adapter-button {
        background-color: #2b2c2d !important;
        border: 1px solid #3c3d3e !important;
        transition: all 0.2s !important;
      }
      .wallet-adapter-button:not([disabled]):hover {
        background-color: #ff6200 !important;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@solana/web3.js": "https://esm.sh/@solana/web3.js@1.98.0",
    "@solana/wallet-adapter-base": "https://esm.sh/@solana/wallet-adapter-base@0.9.25",
    "@solana/wallet-adapter-react": "https://esm.sh/@solana/wallet-adapter-react@0.15.35",
    "@solana/wallet-adapter-react-ui": "https://esm.sh/@solana/wallet-adapter-react-ui@0.9.35",
    "@solana/wallet-adapter-wallets": "https://esm.sh/@solana/wallet-adapter-wallets@0.19.32"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
